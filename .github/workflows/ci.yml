name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recon
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install ruff pytest -r backend/requirements.txt

      - name: Lint
        run: ruff check .

      - name: Apply schema
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recon
        run: psql $DATABASE_URL -f backend/schema.sql

      - name: Test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/recon
        shell: bash
        run: |
          set +e
          pytest -q
          code=$?
          [ $code -eq 5 ] && exit 0 || exit $code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build
